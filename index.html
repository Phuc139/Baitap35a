<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký - 221A010581</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-wrapper">
        <h1>Đăng ký tài khoản</h1>
        <p class="info">Họ tên: <strong>HUỲNH THANH PHÚC</strong> | MSSV: <strong>221A010581</strong></p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Tên</label>
                <input type="text" id="fullName" placeholder="Nhập họ tên">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Ít nhất 8 ký tự, có hoa, thường, số">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="agreeTerms">
                <label for="agreeTerms">Đồng ý điều khoản</label>
            </div>

            <button type="submit">Đăng ký</button>
            <p id="formMessage"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
